<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <title>Add Employee</title>
    <style>
        body {
            padding-top: 20px;
        }

        .header {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Pridať nového zamestnanca</h2>
    </div>

    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <div class="mb-3">
            <label for="firstName" class="form-label">Meno</label>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}">
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Priezvisko</label>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}">
        </div>

        <div class="mb-3">
            <label class="form-label">Dátum narodenia</label>
            <input type="date" th:field="*{birthDate}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Telefónne číslo</label>
            <input type="text" th:field="*{phone}" class="form-control" placeholder="+xxxxxxxxxx">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="mail@example.com">
        </div>

        <div class="mb-3">
            <label for="jobTitle" class="form-label">Pozícia</label>
            <select class="form-select" id="jobTitle" th:field="*{jobTitle}">
                <option th:each="title : ${jobTitles}" th:value="${title}" th:text="${title}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Typ úvazku</label><br>
            <div th:each="type : ${workTypes}">
                <input type="radio" th:field="*{fullTime}" th:value="${type}" class="form-check-input">
                <span th:text="${type}"></span><br>
            </div>
        </div>

        <div class="mb-3">
            <label for="salary" class="form-label">Plat (€)</label>
            <input type="number" step="0.01" class="form-control" id="salary" th:field="*{salary}">
        </div>

        <button type="submit" class="btn btn-primary">Uložiť</button>
    </form>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-cu3wyZ4uGpNuxFcbXcvrkjkXckI/4L33U4o22Z7FJ3d3wM4l8QKjTn4A4Vb8RPSz8"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js" integrity="sha512-..."
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</body>
</html>
